# Packages allowed to run install scripts. @parcel/watcher is the file watcher of sass; the others
# fetch or validate a platform binary.
allowBuilds:
  "@biomejs/biome": true
  "@parcel/watcher": true
  esbuild: true
  rumdl: true

# CM6 extensions and history annotations must share the host-compatible instances.
overrides:
  "@codemirror/state": "6.5.0"
  "@codemirror/view": "6.38.6"

# eslint-plugin-obsidianmd pins its obsidian peer to 1.8.7; the plugin targets a newer API.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-obsidianmd>obsidian": "1.14.4"

# Ask before installing a version younger than the minimum release age; never exclude it silently.
minimumReleaseAgeStrict: true
