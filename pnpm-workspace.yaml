allowBuilds:
  "@biomejs/biome": true
  "@parcel/watcher": true
  electron: true
  esbuild: true
  rumdl: true

minimumReleaseAgeExclude:
  - obsidian@1.14.4

# CM6 extensions and history annotations must share the host-compatible instances.
overrides:
  "@codemirror/state": "6.5.0"
  "@codemirror/view": "6.38.6"
  # Security patches for transitive development tooling; Vue plugin supports Vite 6.
  "js-yaml@^4": "4.3.2"
  "vitepress>vite": "6.4.3"
