[global]

disable = ["MD013", "MD045"]

exclude = [
  ".git",
  ".github",
  "node_modules",
  "vendor",
  "lib-dist",
  "dist",
  "build",
  ".claude",
  "src/texts",
  "LICENSE.md",
  # Written by the release tooling in its own format.
  "CHANGELOG.md"
]

respect-gitignore = true

# Documents carry `title` in frontmatter and repeat it as the single H1.
[MD025]
front-matter-title = ""
