name: Release

# On every push to main, release-please opens or updates one Release PR with the next version and
# the changelog. Merging that pull request is the human release gate: it creates the tag (no "v"
# prefix) and the GitHub release, and the jobs below build and attach the plugin files.
#
# Pull requests opened with the default token do not start other workflows. Set the repository
# secret RELEASE_TOKEN (a token with contents and pull-request write access) to have CI run on the
# Release PR by itself; without it, push a commit to the Release PR or close and reopen it.
on:
  push:
    branches: [main]
  # Rebuilds the Release PR on demand, for example after closing a stale one.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build release files
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the plugin version
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          echo "tag=${TAG_NAME} manifest=${manifest}"
          test "${TAG_NAME}" = "${manifest}"
      - run: pnpm run verify
      - name: Package the plugin folder
        run: |
          id=$(node -p "require('./manifest.json').id")
          mkdir -p "release/${id}"
          cp -r dist/. "release/${id}/"
          cp LICENSE THIRD_PARTY_NOTICES.md "release/${id}/"
          (cd release && zip -r "${id}.zip" "${id}")
          cp dist/main.js dist/manifest.json dist/styles.css release/
          rm -r "release/${id}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: Attach release files
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG_NAME}" release/* --clobber
